<mat-toolbar color="primary" class="header-toolbar">
  <div class="toolbar-left">
    <mat-icon class="logo-icon">account_balance</mat-icon>
    <span class="app-title" [routerLink]="getDashboardLink()">Grievance Portal</span>
  </div>

  @if (currentUser) {
    <div class="toolbar-right">
      <button mat-icon-button [matMenuTriggerFor]="notificationMenu" class="notification-btn">
        <mat-icon [matBadge]="unreadCount > 0 ? unreadCount : null" matBadgeColor="warn">
          notifications
        </mat-icon>
      </button>
      <mat-menu #notificationMenu="matMenu">
        <button mat-menu-item [routerLink]="getNotificationsLink()">
          <mat-icon>mark_email_read</mat-icon>
          <span>View Notifications</span>
        </button>
      </mat-menu>

      <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-btn">
        <mat-icon>account_circle</mat-icon>
        <span class="user-name">{{ currentUser.fullName }}</span>
        <span class="user-role">({{ getRoleDisplayName() }})</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item [routerLink]="getDashboardLink()">
          <mat-icon>dashboard</mat-icon>
          <span>Dashboard</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </div>
  }
</mat-toolbar>
